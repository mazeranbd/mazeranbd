</style></head><body>
<header><div class="nav"><a class="logo" id="logo" href="#/"></a><nav><a href="#/">Home</a><a href="#/shop">Collection</a><a href="#/cart">Cart (<span id="cn">0</span>)</a></nav></div></header>

<script>

policy_delivery:'We deliver across Bangladesh. The delivery charge depends on the area you select at checkout.',policy_return:'Please contact us on WhatsApp for returns and refunds.',policy_privacy:'We use your name, phone and address only to process your order. We do not sell your information.'};

...[1,2,3].flatMap(i=>[['h'+i+'_on','Slide '+i+' enabled (1 or 0)'],['h'+i+'_title','Slide '+i+' headline'],['h'+i+'_text','Slide '+i+' text','area'],['h'+i+'_img','Slide '+i+' poster/image','img'],['h'+i+'_video','Slide '+i+' video (MP4)','vid'],['h'+i+'_btn','Slide '+i+' button text'],['h'+i+'_link','Slide '+i+' button link (optional)'],['h'+i+'_pos','Slide '+i+' text position (left, center, right)']]),

const cnt=()=>$('#cn').textContent=S.cart.reduce((a,l)=>a+l.qty,0);
function price(p,b){const v=+p.discount_value,on=!!p.offer_enabled&&v>0&&(!p.offer_ends||new Date(p.offer_ends)>new Date());let n=b;if(on)n=p.discount_type=='percent'?Math.round(b*(1-v/100)):b-v;return{base:b,now:Math.max(0,n),on}}
const cn=p=>p.cats.map(id=>(S.cats.find(c=>c.id==id)||{}).name).filter(Boolean),catName=p=>cn(p).join(' · ')||p.category||'';
const vis=()=>S.prods.filter(p=>p.status=='active'&&p.V.length&&(!p.cats.length||p.cats.some(id=>(S.cats.find(c=>c.id==id)||{}).active)));
const norm=p=>({...p,cats:(p.product_categories||[]).length?p.product_categories.map(x=>x.category_id):(p.category_id?[p.category_id]:[]),V:(p.product_variants||[]).filter(v=>v.active).flatMap(v=>(v.variant_sizes||[]).filter(s=>s.active).map(s=>({...s,type:v.type,size_ml:+s.size_ml}))).sort((a,b)=>a.type.localeCompare(b.type)||a.size_ml-b.size_ml)});
const slug=(n,c)=>c.toLowerCase()+(n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')?'-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''):'');
async function load(){if(!live){toast('Backend not connected. Check config.js',1);return}
const sel='*,product_variants(id,type,active,variant_sizes(id,size_ml,price,stock,active,image)),product_categories(category_id)';
const r=await Promise.all([sb.from('settings').select('*'),sb.from('products').select(sel).order('created_at',{ascending:false}),sb.from('categories').select('*').order('sort_order').order('name'),sb.from('delivery_areas').select('*').order('sort_order')]);
if(r.some(x=>x.error)){toast('Could not load store data. Please refresh.',1);return}
S.set=Object.fromEntries(r[0].data.map(x=>[x.key,x.value]));S.prods=r[1].data.map(norm);S.cats=r[2].data;S.areas=r[3].data;S.loaded=true}
function drawHead(){const b=g('brand'),l=g('logo');document.title=b+' | '+g('tagline');document.documentElement.style.setProperty('--gold',g('gold'));
$('#logo').innerHTML=(l?`<img src="${esc(l)}" alt="">`:'')+`<span>${esc(b)}<small>${esc(g('tagline').toUpperCase())}</small></span>`;

const homeHTML=()=>`<div id="hero" class="hero"></div><div class="wrap"><div class="ctr"><a class="btn" href="#/shop">See Our Full Collection</a></div>${sec('best','Best Seller')}${sec('trend','Trending')}${sec('new','New in Stock')}<div class="ctr"><a class="btn" href="#/shop">Explore More</a></div></div>`;
function drawHero(){clearTimeout(ht);const h=$('#hero');if(!h)return;const sl=[1,2,3].filter(i=>g('h'+i+'_on')!='0');if(!sl.length){h.style.display='none';return}h.style.display='';S.slide%=sl.length;

h.innerHTML=(vid&&!rm?`<video class="hv" src="${esc(vid)}" poster="${esc(img)}" muted autoplay loop playsinline preload="metadata" onerror="this.remove()"></video>`:'')+`<div><div class="eb">${esc(g('tagline').toUpperCase())}</div><h1>${esc(g('h'+i+'_title'))}</h1><p>${esc(g('h'+i+'_text'))}</p><a class="btn" href="${/^https?:\/\/|^#\//.test(lk)?esc(lk):'#/shop'}">${esc(g('h'+i+'_btn'))}</a></div><div class="dots">${sl.map((_,n)=>`<button aria-label="Slide ${n+1}" class="${n==S.slide?'on':''}" onclick="S.slide=${n};drawHero()"></button>`).join('')}</div>`;

const shopHTML=()=>`<div class="wrap"><h2>Our Collection</h2><div class="bar"><input id="sq" placeholder="Search name or code" aria-label="Search" value="${esc(S.q)}" oninput="S.q=this.value;drawShop()"><select aria-label="Sort" onchange="S.sort=this.value;drawShop()">${[['new','Newest'],['lo','Price: low to high'],['hi','Price: high to low'],['az','Name A–Z']].map(([k,l])=>`<option value="${k}" ${S.sort==k?'selected':''}>${l}</option>`).join('')}</select></div><div class="chips" id="chips"></div><div class="grid" id="grid"></div></div>`;

<div class="sizes" role="group" aria-label="Size">${ss.map(x=>`<button class="${x.id==s.id?'on':''}" aria-pressed="${x.id==s.id}" onclick="pk('${p.id}','${t}','${x.id}')">${x.size_ml}ml</button>`).join('')}</div>

if(!S.user)return box(`<div class="panel"><div class="f"><label for="a_e">Email</label><input id="a_e" type="email" autocomplete="username"></div><div class="f"><label for="a_p">Password</label><input id="a_p" type="password" autocomplete="current-password"></div><button class="gold" onclick="login()">Sign in</button></div>`);
if(!S.isAdmin)return box('<div class="notice">This account is not an administrator.</div><button onclick="logout()">Sign out</button>');
const P=S.prods,O=S.orders,n=s=>O.filter(o=>o.status==s).length,sz=P.flatMap(p=>p.V.map(s=>({p,s}))),nw=O.filter(o=>o.status=='pending'&&!o.is_reviewed).length;
const T=[['ov','Overview'],['or','Orders'+(nw?' ('+nw+' new)':'')],['pr','Products'],['ca','Categories'],['de','Delivery'],['st','Settings']];
const box2=(h,l)=>`<div class="panel"><h3>${h}</h3><div class="muted">${l}</div></div>`;
const body=S.at=='ov'?`<div class="grid">${box2(nw,'New orders (unreviewed)')}${box2(n('pending'),'Pending')}${box2(n('confirmed'),'Confirmed')}${box2(n('processing'),'Processing')}${box2(n('shipped'),'Shipped')}${box2(n('delivered'),'Delivered')}${box2(n('cancelled'),'Cancelled')}${box2(sz.filter(x=>x.s.stock>0&&x.s.stock<=5).length,'Low stock (5 or less)')}${box2(sz.filter(x=>x.s.stock==0).length,'Out of stock')}${box2(P.filter(p=>!p.image||!p.description||!p.V.length).length,'Products with missing info')}</div><p class="muted">Google Sheets and automatic WhatsApp are not connected yet.</p>`
:S.at=='or'?`<div class="chips">${['all','pending','confirmed','processing','shipped','delivered','cancelled'].map(s=>`<button class="${S.ofil==s?'on':''}" onclick="S.ofil='${s}';adminDraw()">${s}</button>`).join('')}</div>`+(O.filter(o=>S.ofil=='all'||o.status==S.ofil).map(orderH).join('')||'<p class="muted">No orders.</p>')
:S.at=='pr'?(S.edit?`<div class="panel" id="pform">${pfi()}</div>`:`<button class="gold" onclick="openEdit('')">Add product</button> `+P.map(p=>{const b=!p.image||!p.description||!p.V.length;return`<div class="line"><div><b>${esc(p.name)}</b> <span class="muted">${esc(p.code)} · ${p.status} · ${esc(catName(p))} · ${p.V.map(s=>s.type[0].toUpperCase()+s.size_ml+':'+s.stock).join(' ')}</span>${b?' <span class="err muted">incomplete</span>':''}</div><div class="row"><button class="o" onclick="openEdit('${p.id}')">Edit</button><button class="o" onclick="archp('${p.id}','${p.status=='archived'?'draft':'archived'}')">${p.status=='archived'?'Restore':'Archive'}</button></div></div>`}).join(''))
:S.at=='ca'?S.cats.map(crow).join('')+`<h3>New category</h3><div class="panel"><div class="row"><input id="cn_" placeholder="Name" style="flex:2;width:auto"><input id="cd_" placeholder="Description" style="flex:3;width:auto"><input id="co_" type="number" value="0" style="width:70px"><label><input type="checkbox" id="ca_" checked> Visible</label><button class="gold" onclick="savec('')">Add</button></div></div>`
:S.at=='de'?S.areas.map(arow).join('')+`<h3>New area</h3><div class="panel"><div class="row"><input id="an_" placeholder="Area name" style="flex:2;width:auto"><select id="ac_" style="width:auto"><option>inside</option><option selected>standard</option><option>special</option></select><input id="af_" type="number" value="130" style="width:90px"><input id="at_" placeholder="Note" style="flex:2;width:auto"><label><input type="checkbox" id="aa_" checked> Active</label><button class="gold" onclick="savea('')">Add</button></div></div>`
:`<div class="chips">${SG.map((x,i)=>`<button class="sgb ${(S.sg||0)==i?'on':''}" onclick="S.sg=${i};sgs()">${x[0]}</button>`).join('')}</div><div class="panel">${SG.map((x,i)=>`<div class="sg" data-i="${i}" style="${(S.sg||0)==i?'':'display:none'}"><h3>${x[0]}</h3>${x[1]()}</div>`).join('')}<button class="gold" onclick="saves()">Save all settings</button></div>`;
m.innerHTML=`<div class="wrap"><div class="row" style="justify-content:space-between"><h2>Admin</h2><button class="o" onclick="logout()">Sign out</button></div><div class="chips">${T.map(([k,l])=>`<button class="${S.at==k?'on':''}" onclick="S.at='${k}';S.edit=D=null;adminDraw()">${l}</button>`).join('')}</div>${body}</div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#a_e').value.trim(),password:$('#a_p').value});if(error)toast('Sign in failed: '+error.message,1)}
const logout=()=>sb.auth.signOut();
async function setUser(s){const prev=S.user&&S.user.id;S.user=s?s.user:null;S.isAdmin=false;if(S.user){const{data}=await sb.from('admins').select('user_id').eq('user_id',S.user.id);S.isAdmin=!!(data&&data.length);if(S.isAdmin&&prev!=S.user.id){await adminLoad();await load();sb.channel('ord').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>{if(S.view=='admin'&&!S.edit&&['ov','or'].includes(S.at))adminLoad().then(adminDraw)}).subscribe()}}
if(S.view=='admin'&&(!S.edit||prev!=(S.user&&S.user.id)))adminDraw()}
function route(){const[v,a]=(location.hash.slice(2)||'').split('/');S.view=v||'';const m=$('#app');clearTimeout(ht);
if(v=='cart'){m.innerHTML=cartHTML();drawLines()}else if(v=='admin')adminDraw();else if(v=='page')m.innerHTML=pageHTML(a);else if(v=='shop'){m.innerHTML=shopHTML();drawShop()}else if(v=='product')m.innerHTML=prodHTML(decodeURIComponent(a||''));else if(v=='done')m.innerHTML=doneHTML(decodeURIComponent(a||''));else{S.view='';m.innerHTML=homeHTML();drawHero()}cnt()}
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
setInterval(()=>{if(S.view=='admin'&&S.isAdmin&&!S.edit&&['ov','or'].includes(S.at)&&!document.hidden)adminLoad().then(adminDraw)},30000);
(async()=>{await load();drawHead();if(live)sb.auth.onAuthStateChange((_e,s)=>setTimeout(()=>setUser(s),0));route()})();
</script></body></html>
